<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command drills | CSE326</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="wrap" id="wrap">
  <div class="empty"><span class="spin"></span> Loading drills&hellip;</div>
</div>

<script src="js/check.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
<script>
"use strict";
mountShell("drills.html");

var DRILLS = [], CAT = "", Q = "", D = null;

function drawList() {
  var cats = [];
  DRILLS.forEach(function (d) {
    if (cats.indexOf(d.cat) < 0) cats.push(d.cat);
  });

  var rows = DRILLS.filter(function (d) {
    if (CAT && d.cat !== CAT) return false;
    if (!Q) return true;
    return (d.ask + " " + d.cat).toLowerCase().indexOf(Q.toLowerCase()) > -1;
  });

  var done = Progress.count("drills", "done");
  var h = '<p class="eyebrow">Two minutes each</p>' +
    '<h1 class="sec-h" style="font-size:27px">Command drills</h1>' +
    '<p class="sec-p">One drill for every tag, attribute, input type and ' +
    "CSS property that can appear in the paper. " + done + " of " +
    DRILLS.length + " solved.</p>" +

    '<div class="filters">' +
      '<input id="q" placeholder="Search a command..." value="' + esc(Q) +
      '" oninput="setQ(this.value)">' +
      '<span class="chip' + (CAT === "" ? " on" : "") +
      '" onclick="setCat(\'\')">All</span>' +
      cats.map(function (c) {
        return '<span class="chip' + (CAT === c ? " on" : "") +
          '" onclick="setCat(\'' + c.replace(/'/g, "\\'") + '\')">' +
          esc(c) + "</span>";
      }).join("") +
    "</div>";

  if (!rows.length) {
    h += '<div class="empty">Nothing matches that search.</div>';
  } else {
    var byCat = {}, order = [];
    rows.forEach(function (d) {
      if (!byCat[d.cat]) { byCat[d.cat] = []; order.push(d.cat); }
      byCat[d.cat].push(d);
    });
    order.forEach(function (c) {
      h += '<h2 class="sec-h" style="font-size:17px;margin:24px 0 11px">' +
        esc(c) + ' <span class="pill gry">' + byCat[c].length +
        "</span></h2><div class=\"items\">" +
        byCat[c].map(function (d) {
          var st = Progress.status("drills", d.id);
          return '<div class="item ' + st + '" onclick="open_(\'' + d.id +
            '\')"><span class="n">' +
            (st === "done" ? "&#10003;" : "&#9998;") + "</span>" +
            '<span class="ask">' + d.ask + "</span></div>";
        }).join("") + "</div>";
    });
  }
  $("wrap").innerHTML = h;
}

function setQ(v) {
  Q = v;
  drawList();
  var el = $("q");
  if (el) { el.focus(); el.setSelectionRange(el.value.length,
                                             el.value.length); }
}
function setCat(c) { CAT = c; drawList(); }

function open_(id) {
  D = DRILLS.filter(function (d) { return d.id === id; })[0];
  if (!D) return;
  var i = DRILLS.map(function (d) { return d.id; }).indexOf(id);
  var next = DRILLS[i + 1];

  $("wrap").innerHTML =
    '<a class="back" href="#" onclick="back(event)">&larr; All drills</a>' +
    '<div class="card">' +
      '<span class="pill saf">' + esc(D.cat) + "</span>" +
      '<h1 style="font-size:21px;margin:10px 0 14px;line-height:1.4">' +
      D.ask + "</h1>" +
      (D.why ? '<div class="note" style="background:#EEF2FF;' +
        'border-left-color:#6366F1"><b>Why it matters:</b> ' + esc(D.why) +
        "</div>" : "") +
      '<div id="pad"></div>' +
    "</div>" +
    '<div style="display:flex;justify-content:space-between;gap:10px">' +
      '<button class="btn ghost" onclick="back(event)">&larr; Back to list' +
      "</button>" +
      (next ? '<button class="btn saf" onclick="open_(\'' + next.id +
        '\')">Next drill &rarr;</button>' : "") +
    "</div>";

  PracticePad({ mount: $("pad"), id: D.id, kind: "drills",
                starter: D.starter || "", checks: D.checks,
                solution: D.solution, brief: D.ask });
  window.scrollTo(0, 0);
}

function back(e) { if (e) e.preventDefault(); D = null; drawList(); }

(async function () {
  try {
    DRILLS = await loadJSON("drills.json");
    Check.setSlips(await loadJSON("slips.json"));
    drawList();
  } catch (e) {
    $("wrap").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
  }
})();
</script>
</body>
</html>
