<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock test | CSE326</title>
<link rel="stylesheet" href="css/theme.css?v=2026-09-27b">
<link rel="stylesheet" href="css/site.css?v=2026-09-27b">
<style>
  .rules{background:linear-gradient(90deg,var(--warn-bg),
    rgba(255,248,235,.35));border-left:4px solid #F0A429;padding:15px 18px;
    border-radius:0 12px 12px 0;margin-bottom:20px;line-height:1.7}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;margin:16px 0 24px}
  .r{background:rgba(255,255,255,.96);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px}
  .r .n{font-size:20px;font-weight:800;color:var(--saffron-d);line-height:1.1}
  .r .l{font-size:12.3px;color:var(--mut);margin-top:5px;font-weight:600}
  .q{background:rgba(255,255,255,.97);border:1px solid var(--line);
    border-radius:14px;padding:19px 21px;margin-bottom:13px;
    box-shadow:var(--shadow)}
  .qn{font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:7px}
  .qt{font-weight:700;font-size:15.5px;line-height:1.6;margin-bottom:12px}
  .opt{display:flex;gap:11px;align-items:flex-start}
  .opt .k{font-weight:800;color:var(--mut);flex:0 0 auto}
  .opt.sel{border-color:var(--saffron);background:var(--saffron-pale)}
  .opt.dis{cursor:default}
  .sticky{position:sticky;bottom:0;background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:13px 0;margin-top:20px;z-index:10}
  .sticky .in{max-width:1120px;margin:0 auto;padding:0 22px;display:flex;
    gap:13px;align-items:center;flex-wrap:wrap}
  .score{background:linear-gradient(120deg,#FFF3E4,#FFFFFF 55%,#E9F7E7);
    border:1px solid var(--line);border-radius:18px;padding:26px 28px;
    margin-bottom:20px;box-shadow:var(--shadow)}
  .sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
    gap:14px}
  .sg{background:rgba(255,255,255,.85);border-radius:12px;padding:14px 16px}
  .sg .n{font-size:23px;font-weight:800;line-height:1}
  .sg .l{font-size:12px;color:var(--mut);margin-top:5px;font-weight:600}
  .sg.ok .n{color:var(--ok)}.sg.bad .n{color:var(--bad)}
  .sg.net .n{color:var(--saffron-d)}

/* ---- chapter picker ---- */
.pick-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.pick-grid { display: grid; gap: 18px; }
.pick-head { display: flex; align-items: center; gap: 10px; font-weight: 800;
  font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--mut); margin: 0 0 8px; }
.pick-only { font: 700 11.5px/1 inherit; color: var(--mut); cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 9px; text-transform: none; letter-spacing: 0; }
.pick-only:hover { color: var(--ink); border-color: var(--saffron); }
.pick-list { display: grid; grid-template-columns: repeat(auto-fill,
  minmax(260px, 1fr)); gap: 6px; }
.pick-row { display: flex; align-items: center; gap: 9px; cursor: pointer;
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px;
  font-size: 13.5px; background: #fff; }
.pick-row:hover { border-color: var(--saffron); }
.pick-row.on { background: var(--saffron-pale); border-color: var(--saffron); }
.pick-row.off { opacity: .45; cursor: default; background: var(--bg); }
.pick-row.off:hover { border-color: var(--line); }
.pick-row input { accent-color: var(--saffron-d); width: 15px; height: 15px;
  flex: 0 0 auto; margin: 0; }
.pick-n { font-weight: 800; color: var(--mut); min-width: 20px;
  font-variant-numeric: tabular-nums; }
.pick-row.on .pick-n { color: var(--saffron-d); }
.pick-t { flex: 1 1 auto; line-height: 1.3; }
.pick-c { font-weight: 700; font-size: 12px; color: var(--mut);
  font-variant-numeric: tabular-nums; }
.pick-sum { font-size: 14px; margin: -4px 0 12px; }
@media (max-width: 560px) { .pick-list { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="empty"><span class="spin"></span> Loading&hellip;</div>
</div>
<div id="barSlot"></div>

<script src="js/check.js?v=2026-09-27b"></script>
<script src="js/ai.js?v=2026-09-27b"></script>
<script src="js/app.js?v=2026-09-27b"></script>
<script>
"use strict";
mountShell("test.html");

var BANK = [], QS = [], PICK = {}, DONE = false;

/* Which textbook chapter revises each question. Bank questions carry a
   topic name; lesson quizzes carry the lesson id. */
var TOPIC_CH = {
  "Web basics": 1, "Document structure": 4, "Elements and attributes": 5,
  "Block and inline": 5, "Headings and text": 6, "Text formatting": 6,
  "Lists": 7, "Links and images": 8, "SVG": 9, "Multimedia": 10,
  "SEO and best practice": 11, "Semantic structure": 13, "Forms": 16,
  "Input types": 17, "Tables": 19,
  "CSS basics": 22, "Specificity and the cascade": 23, "Box model": 28,
  "Positioning": 29, "Flexbox and Grid": 30, "Responsive design": 37,
  "Pseudo-classes and motion": 32
};
/* The seven CSS bank topics each span several chapters of Unit 3: one topic
   covers Flexbox AND Grid, another covers pseudo-classes, attribute
   selectors, variables, transitions AND animations. When the wording names
   the narrower subject, send the student to that exact chapter instead of
   the topic's default.

   Two rules keep this honest. It reads only the question and the
   explanation, never the options, because the distractors are deliberately
   wrong and would misroute ("How do you centre a block?" offers a
   text-align decoy). And it only runs on CSS questions, so HTML wording
   such as "border" in a tables question is never caught. */
var CSS_TOPIC = { "CSS basics": 1, "Specificity and the cascade": 1,
  "Box model": 1, "Positioning": 1, "Flexbox and Grid": 1,
  "Responsive design": 1, "Pseudo-classes and motion": 1 };
var REFINE = [
  /* how the cascade works comes first: a question about inheritance is
     about the cascade even when it names font and colour properties */
  [/specificity|!important|\bcascade\b|\binherit/i, 23],
  [/@keyframes|\banimation|\binfinite\b|\bsteps\(/i, 39],
  [/\btransition|cubic-bezier|\bease-(in|out)|\bease\b/i, 38],
  [/grid-template|\bgrid\b|\bfr\b|minmax|auto-fit|auto-fill|grid-(area|column|row|gap)/i, 31],
  [/flex-direction|justify-content|align-items|flex-wrap|flexbox|\bflex\b/i, 30],
  [/::before|::after|::first-(line|letter)|pseudo-element/i, 33],
  [/\[[a-z-]+[~^$*|]?=|attribute selector/i, 34],
  [/--[a-z][\w-]*|var\(|custom propert|css variables?|\bvariables?\b|:root/i, 36],
  [/@media|viewport meta|breakpoint|mobile-first|responsive/i, 37],
  [/:hover|:focus|:active|:visited|:nth-child|:first-child|:last-child|:checked|:disabled|:required|pseudo-class/i, 32],
  [/placeholder|:invalid|\bfieldset\b|styling a form/i, 35],
  [/box-sizing|border-box|margin collaps|\bpadding\b|box model|\bmargin: ?0 auto/i, 28],
  /* "relative to the ROOT font size" is a units question, so positioning
     needs the word "position" itself (or z-index / sticky) to claim it */
  [/\bposition|\bz-index\b|\bsticky\b/i, 29],
  [/text-align|text-transform|text-decoration|text-shadow|letter-spacing|word-spacing|text-indent/i, 27],
  [/font-family|font-size|font-weight|line-height|\bserif\b|typograph/i, 26],
  [/\brgba?\(|\bhsl|hex colou?r|#[0-9a-f]{3,6}\b|background-(image|repeat|size|position|colou?r)|gradient/i, 24],
  [/\brem\b|\bem\b|\bvh\b|\bvw\b|viewport unit|relative unit|absolute unit/i, 25]
];
var LESSON_CH = {
  "u1-01": 1, "u1-02": 4, "u1-03": 6, "u1-04": 6, "u1-05": 5, "u1-06": 7,
  "u1-07": 8, "u1-08": 9, "u1-09": 10, "u1-10": 11, "u1-11": 12,
  "u2-01": 14, "u2-02": 19, "u2-03": 16, "u2-04": 17, "u2-05": 15,
  "u3-01": 22, "u3-02": 23, "u3-03": 28, "u3-04": 29, "u3-05": 30,
  "u3-06": 31, "u3-07": 32
};
function chapterFor(q) {
  if (q.ch) return q.ch;
  if (q.topic && CSS_TOPIC[q.topic]) {
    var t = String(q.q || "") + " " + String(q.why || "");
    for (var i = 0; i < REFINE.length; i++) {
      if (REFINE[i][0].test(t)) return REFINE[i][1];
    }
  }
  if (q.topic && TOPIC_CH[q.topic]) return TOPIC_CH[q.topic];
  var m = String(q.id).match(/^(u\d-\d\d)-/);
  return m && LESSON_CH[m[1]] || 0;
}

/* The quizzes built into the lessons become the question bank. Each one
   already has four options, one correct answer and an explanation. */
function buildBank(lessons) {
  var out = [];
  lessons.forEach(function (l) {
    l.steps.forEach(function (s, i) {
      if (s.kind === "quiz" && (s.options || []).length === 4 &&
          s.answer != null) {
        out.push({ id: l.id + "-" + i, q: s.q, options: s.options,
                   answer: s.answer, why: s.why || "",
                   topic: l.title, unit: l.unit, ch: LESSON_CH[l.id] || 0 });
      }
    });
  });
  return out;
}

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------------------------------------------------------------- picker
   Students revise one chapter at a time, so the paper has to be filterable
   by chapter. Every question is tagged with the chapter that teaches it
   (explicitly for the chapter-derived bank, by topic for the CA2 bank), so
   the picker is built from the textbook's own index. */
var CHAPTERS = [], UNITS = [], SEL = {};
var SEL_KEY = "cse326.test.chapters";

function chapterCounts() {
  var n = {};
  BANK.forEach(function (q) { var c = chapterFor(q); if (c) n[c] = (n[c] || 0) + 1; });
  return n;
}

function selectedChapters() {
  return CHAPTERS.filter(function (c) { return SEL[c.n]; }).map(function (c) { return c.n; });
}

function poolFor(list) {
  var want = {};
  list.forEach(function (n) { want[n] = 1; });
  return BANK.filter(function (q) { return want[chapterFor(q)]; });
}

function saveSel() {
  try { localStorage.setItem(SEL_KEY, JSON.stringify(selectedChapters())); }
  catch (e) { /* private mode: the picker still works, it just forgets */ }
}

function loadSel() {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(SEL_KEY) || "null"); }
  catch (e) { saved = null; }
  SEL = {};
  if (saved && saved.length) {
    saved.forEach(function (n) { SEL[n] = 1; });
    // a chapter that no longer has questions must not silently shrink the paper
    if (!poolFor(selectedChapters()).length) SEL = {};
  }
  if (!selectedChapters().length) CHAPTERS.forEach(function (c) { SEL[c.n] = 1; });
}

function setChapters(pred) {
  CHAPTERS.forEach(function (c) { if (pred(c)) SEL[c.n] = 1; else delete SEL[c.n]; });
  saveSel(); setup();
}

function toggleChapter(n) {
  if (SEL[n]) delete SEL[n]; else SEL[n] = 1;
  saveSel(); refreshPickerState();
}

/* Repaint only the counters and the button, so ticking a box does not
   rebuild the list and lose the reader's scroll position. */
function refreshPickerState() {
  var chosen = selectedChapters(), pool = poolFor(chosen);
  CHAPTERS.forEach(function (c) {
    var el = $("chk" + c.n);
    if (el) el.checked = !!SEL[c.n];
    var row = $("row" + c.n);
    if (row) row.className = "pick-row" + (SEL[c.n] ? " on" : "");
  });
  var sum = $("pickSum"), btn = $("goBtn"), sel = $("howMany");
  if (sum) {
    sum.innerHTML = pool.length
      ? "<b>" + pool.length + "</b> question" + (pool.length === 1 ? "" : "s") +
        " from <b>" + chosen.length + "</b> chapter" +
        (chosen.length === 1 ? "" : "s")
      : "<b>No chapters selected.</b> Tick at least one to start.";
  }
  if (btn) btn.disabled = !pool.length;
  if (sel) {
    var keep = sel.value;
    sel.innerHTML = sizeOptions(pool.length);
    if (keep && sel.querySelector('option[value="' + keep + '"]')) sel.value = keep;
  }
}

function sizeOptions(total) {
  var sizes = [10, 30, 50].filter(function (n) { return n < total; });
  var out = sizes.map(function (n) {
    return '<option value="' + n + '"' + (n === 30 ? " selected" : "") + ">" +
      n + (n === 30 ? " (full CA2 length)" : n === 10 ? " (quick)" : "") +
      "</option>";
  });
  out.push('<option value="' + total + '"' +
    (total <= 30 ? " selected" : "") + ">All " + total + "</option>");
  return out.join("");
}

function setup() {
  var counts = chapterCounts(), pool = poolFor(selectedChapters());

  var groups = UNITS.map(function (u) {
    var rows = CHAPTERS.filter(function (c) { return c.unit === u.id; })
      .map(function (c) {
        var n = counts[c.n] || 0;
        if (!n) {
          return '<div class="pick-row off" title="No questions for this ' +
            'chapter yet"><span class="pick-n">' + c.n + "</span>" +
            '<span class="pick-t">' + c.title + "</span>" +
            '<span class="pick-c">&mdash;</span></div>';
        }
        return '<label class="pick-row' + (SEL[c.n] ? " on" : "") +
          '" id="row' + c.n + '">' +
          '<input type="checkbox" id="chk' + c.n + '"' +
          (SEL[c.n] ? " checked" : "") + ' onchange="toggleChapter(' + c.n +
          ')"><span class="pick-n">' + c.n + "</span>" +
          '<span class="pick-t">' + c.title + "</span>" +
          '<span class="pick-c">' + n + "</span></label>";
      }).join("");
    return '<div class="pick-unit"><div class="pick-head">' + u.title +
      '<button class="pick-only" onclick="setChapters(function(c){' +
      "return c.unit==='" + u.id + "';})\">only this unit</button></div>" +
      '<div class="pick-list">' + rows + "</div></div>";
  }).join("");

  $("wrap").innerHTML =
    '<p class="eyebrow">Assessment practice</p>' +
    '<h1 class="sec-h" style="font-size:27px">CA2 mock test</h1>' +
    '<p class="sec-p">Same shape as the real thing, so nothing on the day ' +
    "is a surprise. Every question is answered somewhere in the textbook, " +
    "and every explanation links to the chapter that teaches it.</p>" +

    '<div class="rules"><b>The rules, from your CA2 instruction sheet:</b>' +
    "<br>Multiple choice, four options (A&ndash;D), <b>exactly one</b> " +
    "correct. There is <b>negative marking of 0.25</b> for every wrong " +
    "answer &mdash; a skipped question costs you nothing, a guess can. " +
    "The paper covers HTML and CSS from the prescribed syllabus only." +
    "</div>" +

    '<div class="rgrid">' +
      '<div class="r"><div class="n">+1</div><div class="l">per correct ' +
      "answer</div></div>" +
      '<div class="r"><div class="n">&minus;0.25</div><div class="l">per ' +
      "wrong answer</div></div>" +
      '<div class="r"><div class="n">0</div><div class="l">for leaving it ' +
      "blank</div></div>" +
      '<div class="r"><div class="n">' + BANK.length +
      '</div><div class="l">questions in the bank</div></div>' +
    "</div>" +

    '<div class="card"><h2>1. Choose your chapters</h2>' +
    '<p class="sec-p" style="margin-top:-4px">Revising one topic? Tick just ' +
    "that chapter. Preparing for the paper? Leave everything ticked.</p>" +
    '<div class="pick-bar">' +
      '<button class="btn ghost sm" onclick="setChapters(function(){return true;})">All chapters</button>' +
      '<button class="btn ghost sm" onclick="setChapters(function(){return false;})">Clear</button>' +
    "</div>" +
    '<div class="pick-grid">' + groups + "</div>" +
    "</div>" +

    '<div class="card"><h2>2. Start the paper</h2>' +
    '<p class="pick-sum" id="pickSum"></p>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
    '<label style="font-size:14px;font-weight:700">Questions: ' +
    '<select id="howMany" style="padding:9px 11px;border:1px solid ' +
    'var(--line);border-radius:9px;font-family:inherit;font-size:14px;' +
    'margin-left:6px">' + sizeOptions(pool.length) + "</select></label>" +
    '<button class="btn saf" id="goBtn" onclick="start()">Start the test' +
    "</button>" +
    "</div></div>";

  $("barSlot").innerHTML = "";
  refreshPickerState();
}

function start() {
  var pool = poolFor(selectedChapters());
  if (!pool.length) return;
  var want = Math.min(parseInt($("howMany").value, 10) || 30, pool.length);
  QS = shuffle(pool.slice()).slice(0, want);
  PICK = {}; DONE = false;

  var chosen = selectedChapters();
  var scope = chosen.length === CHAPTERS.length
    ? "whole syllabus"
    : chosen.length === 1 ? "chapter " + chosen[0]
    : chosen.length + " chapters";

  $("wrap").innerHTML =
    '<p class="eyebrow">CA2 mock &middot; ' + QS.length + " questions &middot; " +
    scope + "</p>" +
    '<h1 class="sec-h" style="font-size:24px">Answer what you know</h1>' +
    '<p class="sec-p">Leave anything you are unsure of blank &mdash; a ' +
    "blank costs 0, a wrong answer costs 0.25.</p>" +
    QS.map(function (q, i) {
      return '<div class="q" id="q' + i + '"><div class="qn">Question ' +
        (i + 1) + " of " + QS.length + " &middot; " + esc(q.topic) +
        '</div><div class="qt">' + q.q + "</div>" +
        q.options.map(function (o, oi) {
          return '<div class="opt" id="o' + i + "_" + oi +
            '" onclick="pick(' + i + "," + oi + ')"><span class="k">' +
            "ABCD"[oi] + "</span><span>" + o + "</span></div>";
        }).join("") + '<div class="why" id="w' + i + '"></div></div>';
    }).join("");

  $("barSlot").innerHTML =
    '<div class="sticky"><div class="in">' +
    '<span class="mut" style="font-weight:700" id="prog"></span>' +
    '<span style="flex:1"></span>' +
    '<button class="btn ghost sm" onclick="location.reload()">Abandon' +
    "</button>" +
    '<button class="btn grn" onclick="submit()">Submit &amp; see score' +
    "</button></div></div>";

  prog();
  window.scrollTo(0, 0);
}

function pick(qi, oi) {
  if (DONE) return;
  QS[qi].options.forEach(function (_, k) {
    var el = $("o" + qi + "_" + k);
    if (el) el.className = "opt";
  });
  if (PICK[qi] === oi) delete PICK[qi];
  else { PICK[qi] = oi; $("o" + qi + "_" + oi).className = "opt sel"; }
  prog();
}

function prog() {
  var n = Object.keys(PICK).length;
  $("prog").innerHTML = "<b>" + n + "</b> of " + QS.length +
    " answered &middot; " + (QS.length - n) + " left blank";
}

function submit() {
  if (DONE) return;
  var blankN = QS.length - Object.keys(PICK).length;
  if (blankN && !confirm("You have left " + blankN +
      " question(s) blank. Blanks score 0. Submit anyway?")) return;
  DONE = true;

  var right = 0, wrong = 0, blank = 0;
  QS.forEach(function (q, i) {
    var chosen = PICK[i];
    q.options.forEach(function (_, k) {
      $("o" + i + "_" + k).className = "opt dis" +
        (k === q.answer ? " right" : "");
    });
    if (chosen == null) blank++;
    else if (chosen === q.answer) right++;
    else { wrong++; $("o" + i + "_" + chosen).className = "opt dis wrong"; }
    var ch = chapterFor(q);
    if (q.why || ch) {
      var w = $("w" + i);
      w.innerHTML = (q.why ? "<b>Why:</b> " + esc(q.why) : "") +
        (ch ? ' <a href="book.html?ch=' + ch + '" style="font-weight:700;' +
          'white-space:nowrap">Revise: Textbook chapter ' + ch + " &rarr;</a>"
          : "");
      w.classList.add("on");
    }
    Progress.mark("quiz", q.id, chosen === q.answer);
  });

  /* The real CA2 formula: +1 correct, -0.25 wrong, 0 blank. */
  var raw = right - (wrong * 0.25);
  var pct = QS.length ? Math.max(0, raw) / QS.length * 100 : 0;
  var lost = wrong * 0.25;

  var verdict;
  if (pct >= 75) verdict = "Comfortable. You would pass this paper well.";
  else if (pct >= 50) verdict = "Solid, but the gap between your raw " +
    "correct answers and your net score is where the marks are going.";
  else verdict = "Worth going back through the lessons before the real " +
    "test. The tag reference is the fastest revision.";

  $("barSlot").innerHTML = "";
  $("wrap").insertAdjacentHTML("afterbegin",
    '<div class="score"><h2 style="font-size:23px;margin:0 0 14px">' +
    "Your CA2 mock result</h2><div class=\"sgrid\">" +
      '<div class="sg ok"><div class="n">' + right + '</div><div class="l">' +
      "correct (+" + right + ")</div></div>" +
      '<div class="sg bad"><div class="n">' + wrong + '</div><div class="l">' +
      "wrong (&minus;" + lost.toFixed(2) + ")</div></div>" +
      '<div class="sg"><div class="n">' + blank + '</div><div class="l">' +
      "left blank (0)</div></div>" +
      '<div class="sg net"><div class="n">' + raw.toFixed(2) +
      '</div><div class="l">net out of ' + QS.length + "</div></div>" +
      '<div class="sg"><div class="n">' + pct.toFixed(0) +
      '%</div><div class="l">percentage</div></div></div>' +
    '<p style="margin-top:16px;font-size:15px;line-height:1.7;' +
    'color:var(--ink-2)">' + esc(verdict) +
    (wrong ? " Negative marking cost you <b>" + lost.toFixed(2) +
      "</b> mark(s) on " + wrong + " wrong answer(s) &mdash; leaving those " +
      "blank would have scored " + right.toFixed(2) + " instead." : "") +
    "</p>" +
    '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">' +
      '<button class="btn saf" onclick="location.reload()">Take another' +
      "</button>" +
      '<a class="btn ghost" href="learn.html">Back to lessons</a>' +
      '<a class="btn ghost" href="reference.html">Revise the tag list</a>' +
    "</div></div>");
  window.scrollTo(0, 0);
}

(async function () {
  try {
    /* Two sources: the standalone bank (185 questions written to CA2 shape)
       plus the quick-check quizzes built into each lesson. */
    var lessons = await loadJSON("lessons.json");
    var bank = [];
    try { bank = await loadJSON("questions.json"); } catch (e) { bank = []; }
    /* questions written straight from the textbook chapters; each one
       already carries the chapter number that answers it */
    var fromBook = [];
    try { fromBook = await loadJSON("questions-book.json"); } catch (e) { fromBook = []; }
    BANK = bank.concat(fromBook, buildBank(lessons));

    /* the picker is built from the textbook's own index */
    try {
      var idx = await (await fetch("data/book/index.json", { cache: "no-cache" })).json();
      UNITS = idx.units || [];
      CHAPTERS = (idx.chapters || []).map(function (c) {
        return { n: c.n, unit: c.unit, title: c.title };
      });
    } catch (e) { UNITS = []; CHAPTERS = []; }

    loadSel();
    setup();
  } catch (e) {
    $("wrap").innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
  }
})();
</script>
